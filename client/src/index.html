<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src must be explicit: without it, fetch/WebSocket fall back to
         default-src 'self', which blocks the renderer's own socket.io-client
         connection (wss://) to the API server outright — real-time updates
         silently never connected because of this, not because of anything in
         useWebSocket.ts itself. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://barakapos-server.onrender.com wss://barakapos-server.onrender.com; img-src 'self' data:" />
    <title>BarakaPOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
