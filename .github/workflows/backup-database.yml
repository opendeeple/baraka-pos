name: Backup database

on:
  schedule:
    # Daily at 02:00 UTC = 07:00 Uzbekistan (UTC+5) — before the store opens.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the Supabase database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set the DATABASE_URL repository secret (Settings > Secrets and variables > Actions > Secrets) — the same Session pooler string used in Render (DEPLOYMENT.md step 1), not the free local-dev placeholder."
            exit 1
          fi
          # pg_dump refuses to dump from a server newer than itself, and the
          # Ubuntu runner's own apt package (16.x) is older than Supabase's
          # Postgres (17.x) — run pg_dump from an official postgres:17 image
          # instead of installing a client package, so it always matches.
          docker run --rm -v "$PWD:/out" postgres:17 \
            pg_dump "$DATABASE_URL" --no-owner --no-acl -F c -f /out/baraka-pos-backup.dump

      # Free private-repo storage is 500MB total for Actions artifacts — 14
      # days keeps a recovery window without filling that up. A single day's
      # dump replaces nothing live; it's pulled down and restored by hand
      # only if the real database is ever lost or corrupted (`pg_restore
      # --clean --if-exists -d <new DATABASE_URL> baraka-pos-backup.dump`).
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: baraka-pos-backup-${{ github.run_id }}
          path: baraka-pos-backup.dump
          retention-days: 14
