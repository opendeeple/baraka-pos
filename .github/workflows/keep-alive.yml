name: Keep server + database awake

on:
  schedule:
    # Every 10 minutes, 03:00-18:00 UTC = 08:00-23:00 Uzbekistan (UTC+5).
    # Render free services sleep after 15 min idle, and Supabase pauses a
    # project after 7 days with zero DB traffic — this ping prevents both.
    - cron: '*/10 3-18 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health endpoint
        run: |
          url="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "Set the RENDER_HEALTH_URL repository variable (Settings > Secrets and variables > Actions > Variables) to e.g. https://barakapos-server.onrender.com/api/health"
            exit 1
          fi
          curl -sf --max-time 30 "$url" || echo "Ping failed (server may be waking up — this is normal on the first ping after a long idle period)"
